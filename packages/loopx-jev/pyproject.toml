[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loopx-jev-pilot"
version = "0.1.0"
description = "Optional scoped progress shadow observations for LoopX"
requires-python = ">=3.11"
dependencies = ["loopx>=1.1.0"]

[project.scripts]
loopx-jev = "loopx_jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
